# Grafana автоматически загружает дашборды из папки при старте.
apiVersion: 1

providers:
  - name: "Marketplace"
    orgId: 1
    folder: "Marketplace"
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

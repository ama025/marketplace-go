syntax = "proto3";

// package — уникальное имя пакета в мире protobuf
package greet;

// option go_package — куда генерировать Go файлы
// формат: "путь/к/пакету;имя_пакета_в_go"
option go_package = "marketplace/internal/promotion/grpc/greetpb;greetpb";

// GreetService — gRPC сервис promotion-а.
// Basket вызывает эти методы чтобы получить скидки.
service GreetService {
  // SayHello — тестовый метод: проверяем что gRPC работает
  rpc SayHello(HelloRequest) returns (HelloResponse);

  // GetDiscount — получить активную скидку для одного товара
  rpc GetDiscount(GetDiscountRequest) returns (GetDiscountResponse);

  // GetDiscounts — получить скидки для списка товаров сразу (batch)
  rpc GetDiscounts(GetDiscountsRequest) returns (GetDiscountsResponse);

  // AddDiscount — создать новую скидку для товара
  rpc AddDiscount(AddDiscountRequest) returns (AddDiscountResponse);

  // DeactivateDiscount — деактивировать скидку (active=false, запись сохраняется)
  rpc DeactivateDiscount(DeactivateDiscountRequest) returns (DeactivateDiscountResponse);
}

// ─── SayHello ────────────────────────────────────────────────────────────────

message HelloRequest {
  string name = 1; // Имя для приветствия (например, "basket-service")
}

message HelloResponse {
  string message = 1; // Ответ: "Hello, basket-service!"
}

// ─── GetDiscount ─────────────────────────────────────────────────────────────

message GetDiscountRequest {
  string item_id = 1; // UUID товара из каталога
}

message GetDiscountResponse {
  string item_id  = 1; // UUID товара
  double percent  = 2; // Процент скидки (0 если нет скидки)
  bool   active   = 3; // Есть ли активная скидка
}

// ─── GetDiscounts (batch) ─────────────────────────────────────────────────────

message GetDiscountsRequest {
  repeated string item_ids = 1; // Список UUID товаров
}

message GetDiscountsResponse {
  repeated GetDiscountResponse discounts = 1; // Скидки для каждого товара
}

// ─── AddDiscount ──────────────────────────────────────────────────────────────

message AddDiscountRequest {
  string item_id   = 1; // UUID товара из каталога
  double percent   = 2; // Процент скидки (0-100)
  string starts_at = 3; // Начало действия RFC3339 (пустая строка = сразу)
  string ends_at   = 4; // Конец действия RFC3339 (пустая строка = бессрочно)
}

message AddDiscountResponse {
  string discount_id = 1; // UUID созданной скидки
  bool   ok          = 2; // true если скидка успешно создана
}

// ─── DeactivateDiscount ───────────────────────────────────────────────────────

message DeactivateDiscountRequest {
  string discount_id = 1; // UUID скидки которую нужно деактивировать
}

message DeactivateDiscountResponse {
  bool ok = 1; // true если скидка успешно деактивирована
}
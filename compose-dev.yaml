# docker compose -p marketplace-dev -f compose-dev.yaml up -d
# docker-compose -p marketplace-dev -f compose-dev.yaml up -d

# docker compose -p marketplace-dev -f compose-dev.yaml down -v
# docker-compose -p marketplace-dev -f compose-dev.yaml down -v

services:
  catalog_db_dev:
    container_name: "catalog-db-dev" # имя контейнера для базы данных каталога товаров
    image: postgres:18.1 # образ PostgreSQL 18.1
    environment: # переменные окружения для базы данных
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=catalog-db-dev
    restart: always
    ports: # порты для базы данных
      - "9101:5432"
    volumes: 
      - postgres_catalog_dev:/var/lib/postgresql
    networks: 
      - marketplace-dev-net # сеть для базы данных
    healthcheck: # проверка здоровья базы данных
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s  
      retries: 5   
      start_period: 30s

  basket_db_dev: 
    container_name: "basket-db-dev"
    image: postgres:18.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=basket-db-dev
    restart: always
    ports:
      - "9102:5432"
    volumes:
      - postgres_basket_dev:/var/lib/postgresql
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s  
      retries: 5   
      start_period: 30s

  basket_cache_redis_dev:
    container_name: basket-redis-dev
    image: redis:7
    command: redis-server --requirepass "12345678" --protected-mode no
    restart: always
    ports:
      - "9112:6379"
    volumes:
      - redis_basket_dev:/data
    networks:
      - marketplace-dev-net

  # promotion grpc
  promotion_db:
    container_name: promotion-db-dev
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=12345678
      - MYSQL_DATABASE=promotion-db
    restart: always
    ports:
      - "9103:3306"
    volumes:
      - mysql_promotion:/var/lib/mysql
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p12345678"]
      interval: 2s
      timeout: 2s
      retries: 10

  promotion_grpc_dev:
    container_name: promotion-grpc-dev
    build:
      context: .
      dockerfile: cmd/promotion/Dockerfile
    ports:
      - "9203:7003"
    networks:
      - marketplace-dev-net
    environment:
      - PROMOTION_DATABASE_URL=root:12345678@tcp(promotion_db:3306)/promotion-db?parseTime=true&multiStatements=true
      - PROMOTION_MIGRATIONS_PATH=file:///app/migrations/promotion
      - PROMOTION_GRPC_PORT=7003
    depends_on:
      promotion_db:
        condition: service_healthy
    restart: unless-stopped

  # checkout
  checkout_db_dev:
    container_name: checkout-db-dev
    image: postgres:18.1
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345678
      - POSTGRES_DB=checkout-db-dev
    restart: always
    ports:
      - "9104:5432"
    volumes:
      - postgres_checkout_dev:/var/lib/postgresql
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbit_mq_dev:
    container_name: rabbit-mq-dev
    hostname: marketplace-mq
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # monitoring
  prometheus_dev:
    container_name: prometheus-dev
    image: prom/prometheus:v3.10.0
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_dev:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - marketplace-dev-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana_dev:
    container_name: grafana-dev
    image: grafana/grafana:12.3.4
    restart: always
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data_dev:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - marketplace-dev-net
    depends_on:
      prometheus_dev:
        condition: service_healthy

  # ─── k6 Load Testing ─────────────────────────────────────────────────────────
  # Запускаются вручную:
  #   docker compose -p marketplace-dev -f compose-dev.yaml run k6_catalog
  #   docker compose -p marketplace-dev -f compose-dev.yaml run k6_basket
  #   docker compose -p marketplace-dev -f compose-dev.yaml run k6_checkout
  k6_catalog:
    container_name: k6-catalog-test
    image: grafana/k6:latest
    volumes:
      - ./infrastructure/k6:/scripts:ro
    environment:
      - TARGET_URL=http://host.docker.internal:9001
    networks:
      - marketplace-dev-net
    command: ["run", "/scripts/catalog-test.js"]
    restart: "no"
    profiles: ["k6"]  # не запускается при up -d, только через run

  k6_basket:
    container_name: k6-basket-test
    image: grafana/k6:latest
    volumes:
      - ./infrastructure/k6:/scripts:ro
    environment:
      - TARGET_URL=http://host.docker.internal:9002
    networks:
      - marketplace-dev-net
    command: ["run", "/scripts/basket-test.js"]
    restart: "no"
    profiles: ["k6"]

  k6_checkout:
    container_name: k6-checkout-test
    image: grafana/k6:latest
    volumes:
      - ./infrastructure/k6:/scripts:ro
    environment:
      - TARGET_URL=http://host.docker.internal:9004
    networks:
      - marketplace-dev-net
    command: ["run", "/scripts/checkout-test.js"]
    restart: "no"
    profiles: ["k6"]

volumes:
  postgres_catalog_dev:
  postgres_basket_dev:
  redis_basket_dev:
  mysql_promotion:
  postgres_checkout_dev:
  rabbitmq_data_dev:
  prometheus_data_dev:
  grafana_data_dev:

networks:
  marketplace-dev-net:
    driver: bridge